
{% extends "base.html" %}

{% block title %}Editar Serviço - SR. DIO Barbearia{% endblock %}

{% block content %}

<h1 class="titulo">Editar Serviço</h1>

<p class="subtitulo">
    Atualize as informações do serviço selecionado.
</p>

<div class="formulario">

    <form method="POST">

        <div class="form-grupo">
            <label for="nome">Nome do serviço:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                maxlength="100"
                value="{{ servico.nome }}"
                required
            >
        </div>

        <div class="form-grupo">
            <label for="descricao">Descrição:</label>
            <textarea
                id="descricao"
                name="descricao"
                rows="3"
            >{{ servico.descricao or "" }}</textarea>
        </div>

        <div class="form-grupo">
            <label for="preco">Preço (R$):</label>
            <input
                type="number"
                id="preco"
                name="preco"
                min="0.01"
                step="0.01"
                value="{{ servico.preco }}"
                required
            >
        </div>

        <div class="form-grupo">
            <label for="duracao">Duração (minutos):</label>
            <input
                type="number"
                id="duracao"
                name="duracao"
                min="1"
                step="1"
                value="{{ servico.duracao }}"
                required
            >
        </div>

        <div class="acoes">

            <button type="submit" class="btn">
                Salvar alterações
            </button>

            <a
                href="{{ url_for('main.servicos') }}"
                class="btn btn-secundario"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
